name: live-church-worker
on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub may delay scheduled runs by a few minutes
  workflow_dispatch: {}
concurrency:
  group: live-church-worker
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --omit=dev
      - run: node src/index.js
        env:
          # Safe by default: real pushes only when repo variable DRY_RUN is exactly '0'.
          DRY_RUN: ${{ vars.DRY_RUN == '0' && '0' || '1' }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ONESIGNAL_CSM_APP_ID: ${{ secrets.ONESIGNAL_CSM_APP_ID }}
          ONESIGNAL_CSM_REST_KEY: ${{ secrets.ONESIGNAL_CSM_REST_KEY }}
          ONESIGNAL_CACA_APP_ID: ${{ secrets.ONESIGNAL_CACA_APP_ID }}
          ONESIGNAL_CACA_REST_KEY: ${{ secrets.ONESIGNAL_CACA_REST_KEY }}
          ONESIGNAL_CACS_APP_ID: ${{ secrets.ONESIGNAL_CACS_APP_ID }}
          ONESIGNAL_CACS_REST_KEY: ${{ secrets.ONESIGNAL_CACS_REST_KEY }}
